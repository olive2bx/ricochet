name: Release

# Two ways to publish a release:
# - push a v* tag from a terminal;
# - from the GitHub UI (works on mobile): Actions > Release > Run workflow,
#   enter the version: the tag is created on the selected branch's head.
# If a release with that tag already exists (e.g. created from the Releases
# page), the binaries are uploaded to it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid version '$TAG' (expected vMAJOR.MINOR.PATCH, e.g. v0.1.0)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse an existing tag on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists: push it again or pick another version"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Verify
        run: make ci
      - name: Build release artifacts
        run: make dist VERSION="$TAG"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Creates the tag on the commit that was built.
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
